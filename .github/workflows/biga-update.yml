name: biga-update

on:
  schedule:
    - cron: "10 22 * * *"   # 06:10 MYT daily
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'

      - name: Run BIGA-i updater
        working-directory: biga
        run: Rscript update_data.R --verbose

      - name: Commit data if changed
        run: |
          git config user.name "GH ACTION"
          git config user.email "action@github.com"
          git add biga/data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes - nothing to commit"
          else
            git commit -m "biga: data update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
